<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Better Teambuilder for Showdown! — Options</title>
	<style>
		body {
			font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
			color: #222;
			background: #fff;
			margin: 0;
			padding: 20px 24px;
			max-width: 420px;
		}
		h1 {
			font-size: 15px;
			margin: 0 0 16px;
		}
		label {
			display: flex;
			align-items: flex-start;
			gap: 8px;
			cursor: pointer;
		}
		input[type="checkbox"] {
			margin-top: 2px;
		}
		.hint {
			color: #666;
			font-size: 12px;
			margin: 4px 0 0 24px;
		}
		#saved {
			color: #2a7a2a;
			font-size: 12px;
			margin-top: 12px;
			visibility: hidden;
		}
	</style>
</head>
<body>
	<h1>Better Teambuilder for Showdown!</h1>
	<label>
		<input type="checkbox" id="closeSideRoomsOnLoad" />
		Auto-close side rooms on load
	</label>
	<p class="hint">Closes any chat/side rooms Showdown restores from your last session as soon as the page loads.</p>
	<div id="saved">Saved.</div>
	<script src="defaults.js"></script>
	<script src="options.js"></script>
</body>
</html>
